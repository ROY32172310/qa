name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        timeout-minutes: 10
        run: python -m pip install ".[dev]"
      - run: >-
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/dev.py full
      - run: python scripts/dev.py package
      - run: python scripts/dev.py agensi-package
      - name: Serve the clean fixture for Action acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 \
            --bind 127.0.0.1 \
            --directory benchmarks/fixtures \
            >/tmp/ego-webqa-http.log 2>&1 &
          echo "$!" >/tmp/ego-webqa-http.pid
          python3 - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/clean.html") as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("fixture server did not become ready")
          PY
      - name: Create a release baseline through the composite Action
        uses: ./
        with:
          url: http://127.0.0.1:8765/clean.html
          out: webqa-baseline
          viewport-preset: quick
          smoke-selector: "#start"
          smoke-success-selector: "#result"
          smoke-require-assertion: "true"
          fail-on-warn: "true"
          install-browser: "false"
          upload-artifact: "false"
      - name: Gate a second release Action run against the baseline
        uses: ./
        with:
          url: http://127.0.0.1:8765/clean.html
          out: webqa-current
          viewport-preset: quick
          smoke-selector: "#start"
          smoke-success-selector: "#result"
          smoke-require-assertion: "true"
          fail-on-warn: "true"
          baseline-report: webqa-baseline/report.json
          delta-gate: new
          install-browser: "false"
          upload-artifact: "false"
      - name: Verify release Action outputs and job summary
        shell: bash
        run: >-
          python scripts/verify_action_smoke.py
          --baseline-dir webqa-baseline
          --current-dir webqa-current
      - uses: actions/upload-artifact@v5
        with:
          name: python-package
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ego-webqa
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@v6
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Check whether this version is already published
        id: registry-version
        env:
          SERVER_NAME: io.github.ROY32172310/qa
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          published="$(
            curl --fail --silent --show-error \
              "https://registry.modelcontextprotocol.io/v0.1/servers?search=${SERVER_NAME}" |
              jq -r --arg name "$SERVER_NAME" --arg version "$version" \
                '.servers[]? | select(.server.name == $name and .server.version == $version) | .server.version'
          )"
          if [[ "$published" == "$version" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish server metadata
        if: steps.registry-version.outputs.published != 'true'
        run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(dist/*.whl dist/*.tar.gz dist/agensi/*.zip)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "ego-webqa $GITHUB_REF_NAME"
          fi
