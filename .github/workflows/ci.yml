name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - name: Create test artifact directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"
      - run: >-
          python -m pytest -q --junitxml=test-results/pytest.xml
          --cov=ego_webqa --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-report=json --cov-fail-under=90
      - name: Summarize pytest failures
        if: ${{ failure() }}
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results/pytest.xml")
          if not report.is_file():
              print("::error title=pytest::JUnit report was not created")
              raise SystemExit(0)

          for case in ET.parse(report).getroot().iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is None:
                  continue
              name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
              source = case.get("file", "unknown")
              line = case.get("line", "0")
              detail = "\n".join(
                  part.strip()
                  for part in (failure.get("message"), failure.text)
                  if part and part.strip()
              ) or "test failed"
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error file={source},line={line},title={name}::{detail[:8000]}")
      - run: ruff check .
      - run: black --check .
      - run: mypy
      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml
            coverage.json
          if-no-files-found: ignore

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: ego-webqa --version
      - run: >-
          python -c "from importlib.metadata import version; import ego_webqa;
          assert version('ego-webqa') == ego_webqa.__version__"
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: MYPYPATH=src mypy benchmarks
      - run: python benchmarks/run.py --out benchmark-results
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: warn
