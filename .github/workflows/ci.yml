name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: >-
          pytest --cov=ego_webqa --cov-report=term-missing
          --cov-report=xml --cov-fail-under=80
      - run: ruff check .
      - run: black --check .
      - run: mypy

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: ego-webqa --version
      - run: >-
          python -c "from importlib.metadata import version; import ego_webqa;
          assert version('ego-webqa') == ego_webqa.__version__"
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
