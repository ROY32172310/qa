name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        timeout-minutes: 10
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - run: python scripts/dev.py coverage
      - name: Summarize pytest failures
        if: ${{ failure() }}
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results/pytest.xml")
          if not report.is_file():
              print("::error title=pytest::JUnit report was not created")
              raise SystemExit(0)

          failures = 0
          for case in ET.parse(report).getroot().iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is None:
                  continue
              failures += 1
              name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
              source = case.get("file", "unknown")
              line = case.get("line", "0")
              detail = "\n".join(
                  part.strip()
                  for part in (failure.get("message"), failure.text)
                  if part and part.strip()
              ) or "test failed"
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error file={source},line={line},title={name}::{detail[:8000]}")
          if failures:
              raise SystemExit(0)

          coverage = Path("coverage.json")
          if not coverage.is_file():
              print("::error title=coverage::coverage.json was not created")
              raise SystemExit(0)
          import json

          percent = float(json.loads(coverage.read_text(encoding="utf-8"))["totals"]["percent_covered"])
          print(f"::error title=coverage::line/branch coverage failed at {percent:.2f}%")
      - run: python scripts/dev.py lint
      - run: python scripts/dev.py format-check
      - name: Type check with annotations
        shell: python
        run: |
          import subprocess
          import sys

          completed = subprocess.run(
              [sys.executable, "scripts/dev.py", "typecheck"],
              text=True,
              encoding="utf-8",
              errors="replace",
              capture_output=True,
              check=False,
          )
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          if completed.returncode:
              detail = (completed.stderr or completed.stdout or "type check failed")
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=typecheck::{detail[-8000:]}")
          raise SystemExit(completed.returncode)
      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml
            coverage.json
          if-no-files-found: ignore

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        timeout-minutes: 10
        run: python -m pip install ".[dev]"
      - run: python scripts/dev.py package
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: ego-webqa --version
      - run: >-
          python -c "from importlib.metadata import version; import ego_webqa;
          assert version('ego-webqa') == ego_webqa.__version__"
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        timeout-minutes: 10
        run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/dev.py benchmark --out benchmark-results
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: warn

  cross-browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        timeout-minutes: 10
        run: python -m pip install -e ".[dev]"
      - name: Install Firefox and WebKit
        timeout-minutes: 10
        run: python -m playwright install --with-deps firefox webkit
      - name: Run opt-in cross-browser audit
        env:
          EGO_WEBQA_CROSS_BROWSER: "1"
        run: python -m pytest -m cross_browser tests/test_cross_browser_audit.py -q
