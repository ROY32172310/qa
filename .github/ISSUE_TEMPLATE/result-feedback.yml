name: Result feedback
description: Report a false positive, missed defect, or real delivery scenario.
title: "[feedback] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing ego-webqa. Do not upload credentials, signed-in storage
        state, private page content, or an unreviewed full report. A sanitized
        `feedback_bundle.json` is the default attachment. Review it before
        sharing; add target, selector, or message context only when necessary.

        Useful references before filing:
        [completed before/after example](https://roy32172310.github.io/qa/) and
        [15-minute first-trial protocol](https://github.com/ROY32172310/qa/blob/master/docs/first-trial.md).
  - type: dropdown
    id: feedback_type
    attributes:
      label: What happened?
      options:
        - Blocking false positive
        - Rejected a page that was warning-only
        - Missed an obvious delivery defect
        - Unexpected runtime or browser failure
        - Real usage scenario or dimension request
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ego-webqa version
      description: Run `ego-webqa --version`.
      placeholder: "0.8.0"
    validations:
      required: true
  - type: dropdown
    id: target_type
    attributes:
      label: Target type
      options:
        - Public page
        - Local static build (`--dir` / `--file`)
        - Authenticated preview
        - Private or client project
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Reproduction command or config
      description: Remove secrets, signed URLs, query strings, and private hostnames.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Include the reviewed feedback bundle or relevant dimension id and counts.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and why
      description: What should the deterministic check have reported?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Paste a reviewed bundle, relevant Agent summary item, public reproducer, or sanitized screenshot.
    validations:
      required: false
