name: ego-webqa
description: Deterministic delivery QA for AI-generated web pages
author: Roy

inputs:
  url:
    description: Page URL to audit
    required: true
  config:
    description: Path to a JSON configuration file
    required: false
    default: ""
  out:
    description: Artifact output directory
    required: false
    default: webqa-report
  profile:
    description: Check profile
    required: false
    default: baseline
  viewports:
    description: Comma-separated WIDTHxHEIGHT[:NAME] list
    required: false
    default: ""
  viewport-preset:
    description: Closed viewport matrix (quick or full); cannot be combined with viewports
    required: false
    default: ""
  ready-selector:
    description: Wait for this selector before probing
    required: false
    default: ""
  wait-for-network-idle:
    description: Wait up to 3 seconds for network idle
    required: false
    default: "false"
  smoke-mode:
    description: safe blocks post-load network; live permits real side effects
    required: false
    default: safe
  no-smoke:
    description: Skip the primary-CTA click
    required: false
    default: "false"
  smoke-selector:
    description: Explicit primary CTA selector
    required: false
    default: ""
  smoke-success-selector:
    description: Selector that must transition to visible after the CTA click
    required: false
    default: ""
  smoke-success-url-pattern:
    description: URL regex that must newly match after the CTA click
    required: false
    default: ""
  smoke-scope:
    description: Run CTA smoke in the first viewport or all viewports
    required: false
    default: first
  smoke-settle-ms:
    description: Milliseconds to wait after the CTA click
    required: false
    default: "800"
  smoke-require-assertion:
    description: Require a selector or URL assertion for CTA success
    required: false
    default: "false"
  smoke-flow-name:
    description: Select one named flow from smoke_flows in the JSON config
    required: false
    default: ""
  storage-state:
    description: Playwright storage-state JSON file for authenticated previews
    required: false
    default: ""
  http-username:
    description: HTTP Basic username; pass from a GitHub secret
    required: false
    default: ""
  http-password:
    description: HTTP Basic password; pass from a GitHub secret
    required: false
    default: ""
  extra-http-headers:
    description: JSON object of additional HTTP headers; pass from a GitHub secret
    required: false
    default: ""
  fail-on-warn:
    description: Make warnings fail the audit
    required: false
    default: "false"
  baseline-report:
    description: Path to an earlier report.json for root-cause delta gating
    required: false
    default: ""
  delta-gate:
    description: Baseline gate mode (none or new)
    required: false
    default: new
  allow-target-change:
    description: Allow baseline comparison across different target sources
    required: false
    default: "false"
  allow-configuration-change:
    description: Allow baseline comparison across profiles, viewports, or runtimes
    required: false
    default: "false"
  browser-channel:
    description: Optional Chromium channel such as chrome or msedge
    required: false
    default: ""
  browser-engine:
    description: Playwright engine (chromium, firefox, or webkit; WebKit is not real Safari)
    required: false
    default: chromium
  python-version:
    description: Python version used to run the audit
    required: false
    default: "3.12"
  install-browser:
    description: Install the selected Playwright browser before the audit
    required: false
    default: "true"
  upload-artifact:
    description: Upload reports and screenshots after the audit
    required: false
    default: "true"
  artifact-name:
    description: Uploaded artifact name
    required: false
    default: ego-webqa-report
  retention-days:
    description: Artifact retention in days
    required: false
    default: "14"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ego-webqa
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$ACTION_PATH"

    - name: Install browser
      if: ${{ inputs.install-browser == 'true' }}
      shell: bash
      env:
        WEBQA_BROWSER_ENGINE: ${{ inputs.browser-engine }}
      run: |
        case "$WEBQA_BROWSER_ENGINE" in
          chromium|firefox|webkit) ;;
          *)
            echo "invalid browser-engine: $WEBQA_BROWSER_ENGINE" >&2
            exit 2
            ;;
        esac
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          python -m playwright install --with-deps "$WEBQA_BROWSER_ENGINE"
        else
          python -m playwright install "$WEBQA_BROWSER_ENGINE"
        fi

    - name: Run audit
      shell: bash
      env:
        WEBQA_URL: ${{ inputs.url }}
        WEBQA_CONFIG: ${{ inputs.config }}
        WEBQA_OUT: ${{ inputs.out }}
        WEBQA_PROFILE: ${{ inputs.profile }}
        WEBQA_VIEWPORTS: ${{ inputs.viewports }}
        WEBQA_VIEWPORT_PRESET: ${{ inputs.viewport-preset }}
        WEBQA_READY_SELECTOR: ${{ inputs.ready-selector }}
        WEBQA_WAIT_NETWORK_IDLE: ${{ inputs.wait-for-network-idle }}
        WEBQA_SMOKE_MODE: ${{ inputs.smoke-mode }}
        WEBQA_NO_SMOKE: ${{ inputs.no-smoke }}
        WEBQA_SMOKE_SELECTOR: ${{ inputs.smoke-selector }}
        WEBQA_SUCCESS_SELECTOR: ${{ inputs.smoke-success-selector }}
        WEBQA_SUCCESS_URL: ${{ inputs.smoke-success-url-pattern }}
        WEBQA_SMOKE_SCOPE: ${{ inputs.smoke-scope }}
        WEBQA_SMOKE_SETTLE_MS: ${{ inputs.smoke-settle-ms }}
        WEBQA_SMOKE_REQUIRE_ASSERTION: ${{ inputs.smoke-require-assertion }}
        WEBQA_SMOKE_FLOW_NAME: ${{ inputs.smoke-flow-name }}
        WEBQA_STORAGE_STATE: ${{ inputs.storage-state }}
        WEBQA_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        WEBQA_BASELINE_REPORT: ${{ inputs.baseline-report }}
        WEBQA_DELTA_GATE: ${{ inputs.delta-gate }}
        WEBQA_ALLOW_TARGET_CHANGE: ${{ inputs.allow-target-change }}
        WEBQA_ALLOW_CONFIGURATION_CHANGE: ${{ inputs.allow-configuration-change }}
        WEBQA_BROWSER_ENGINE: ${{ inputs.browser-engine }}
        WEBQA_BROWSER_CHANNEL: ${{ inputs.browser-channel }}
        EGO_WEBQA_HTTP_USERNAME: ${{ inputs.http-username }}
        EGO_WEBQA_HTTP_PASSWORD: ${{ inputs.http-password }}
        EGO_WEBQA_EXTRA_HTTP_HEADERS: ${{ inputs.extra-http-headers }}
      run: |
        set -euo pipefail
        args=(
          "$WEBQA_URL"
          "--out" "$WEBQA_OUT"
          "--profile" "$WEBQA_PROFILE"
          "--smoke-mode" "$WEBQA_SMOKE_MODE"
        )
        if [[ -n "$WEBQA_CONFIG" ]]; then
          args+=(--config "$WEBQA_CONFIG")
        fi
        if [[ -n "$WEBQA_VIEWPORTS" ]]; then
          args+=(--viewports "$WEBQA_VIEWPORTS")
        fi
        if [[ -n "$WEBQA_VIEWPORT_PRESET" ]]; then
          args+=(--preset "$WEBQA_VIEWPORT_PRESET")
        fi
        if [[ -n "$WEBQA_READY_SELECTOR" ]]; then
          args+=(--ready-selector "$WEBQA_READY_SELECTOR")
        fi
        if [[ "$WEBQA_WAIT_NETWORK_IDLE" == "true" ]]; then
          args+=(--wait-for-network-idle)
        fi
        if [[ "$WEBQA_NO_SMOKE" == "true" ]]; then
          args+=(--no-smoke)
        fi
        if [[ -n "$WEBQA_SMOKE_SELECTOR" ]]; then
          args+=(--smoke-selector "$WEBQA_SMOKE_SELECTOR")
        fi
        if [[ -n "$WEBQA_SUCCESS_SELECTOR" ]]; then
          args+=(--smoke-success-selector "$WEBQA_SUCCESS_SELECTOR")
        fi
        if [[ -n "$WEBQA_SUCCESS_URL" ]]; then
          args+=(--smoke-success-url-pattern "$WEBQA_SUCCESS_URL")
        fi
        args+=(--smoke-scope "$WEBQA_SMOKE_SCOPE")
        args+=(--smoke-settle-ms "$WEBQA_SMOKE_SETTLE_MS")
        if [[ "$WEBQA_SMOKE_REQUIRE_ASSERTION" == "true" ]]; then
          args+=(--smoke-require-assertion)
        fi
        if [[ -n "$WEBQA_SMOKE_FLOW_NAME" ]]; then
          args+=(--smoke-flow-name "$WEBQA_SMOKE_FLOW_NAME")
        fi
        if [[ -n "$WEBQA_STORAGE_STATE" ]]; then
          args+=(--storage-state "$WEBQA_STORAGE_STATE")
        fi
        if [[ "$WEBQA_FAIL_ON_WARN" == "true" ]]; then
          args+=(--fail-on-warn)
        fi
        if [[ -n "$WEBQA_BASELINE_REPORT" ]]; then
          args+=(--baseline-report "$WEBQA_BASELINE_REPORT")
          args+=(--gate "$WEBQA_DELTA_GATE")
        fi
        if [[ "$WEBQA_ALLOW_TARGET_CHANGE" == "true" ]]; then
          args+=(--allow-target-change)
        fi
        if [[ "$WEBQA_ALLOW_CONFIGURATION_CHANGE" == "true" ]]; then
          args+=(--allow-configuration-change)
        fi
        if [[ "$WEBQA_BROWSER_ENGINE" != "chromium" ]]; then
          args+=(--browser-engine "$WEBQA_BROWSER_ENGINE")
        fi
        if [[ -n "$WEBQA_BROWSER_CHANNEL" ]]; then
          args+=(--browser-channel "$WEBQA_BROWSER_CHANNEL")
        fi
        python -m ego_webqa "${args[@]}"

    - name: Upload report
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out }}
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Write job summary
      if: ${{ always() }}
      shell: bash
      env:
        WEBQA_OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        python - "$WEBQA_OUT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import json
        import pathlib
        import sys

        sys.stdout.reconfigure(encoding="utf-8")
        out = pathlib.Path(sys.argv[1])
        summary_path = out / "feedback_bundle.json"
        print("## ego-webqa delivery QA")
        print()
        if not summary_path.is_file():
            print("No privacy-safe feedback bundle was produced. Review the audit log above.")
            raise SystemExit(0)

        bundle = json.loads(summary_path.read_text(encoding="utf-8"))
        counts = bundle.get("counts", {})
        print(f"**Status:** `{bundle.get('status', 'unknown')}`  ")
        print(
            f"**Findings:** {counts.get('error', 0)} blocking, "
            f"{counts.get('warning', 0)} warnings, "
            f"{counts.get('root_causes', 0)} root causes"
        )
        delta_path = out / "delta.json"
        if delta_path.is_file():
            delta = json.loads(delta_path.read_text(encoding="utf-8"))
            delta_summary = delta.get("summary", {})
            gate = delta.get("gate", {})
            gate_state = "failed" if gate.get("failed") else "passed"
            print(
                f"**Baseline gate:** {gate_state} (`{gate.get('mode', 'unknown')}`) — "
                f"{delta_summary.get('new', 0)} new, "
                f"{delta_summary.get('changed', 0)} changed, "
                f"{delta_summary.get('resolved', 0)} resolved"
            )
        print()
        findings = bundle.get("findings", [])
        if findings:
            print("| Dimension | Blocks | Warnings | Viewports |")
            print("|---|---:|---:|---:|")
            for finding in findings[:20]:
                viewport_count = len(finding.get("viewport_indexes", []))
                print(
                    f"| `{finding.get('dimension_id', 'unknown')}` "
                    f"| {finding.get('block_count', 0)} "
                    f"| {finding.get('warning_count', 0)} "
                    f"| {viewport_count} |"
                )
            if len(findings) > 20:
                print(f"\n{len(findings) - 20} additional root causes are in the artifact.")
        print()
        print(
            "Review `feedback_bundle.json` before sharing. "
            "This step intentionally excludes target URLs, selectors, page text, "
            "messages, raw evidence, and screenshots."
        )
        PY

branding:
  icon: check-circle
  color: green
