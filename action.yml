name: ego-webqa
description: Deterministic delivery QA for AI-generated web pages
author: Roy

inputs:
  url:
    description: Page URL to audit
    required: true
  config:
    description: Path to a JSON configuration file
    required: false
    default: ""
  out:
    description: Artifact output directory
    required: false
    default: webqa-report
  profile:
    description: Check profile
    required: false
    default: baseline
  viewports:
    description: Comma-separated WIDTHxHEIGHT[:NAME] list
    required: false
    default: ""
  ready-selector:
    description: Wait for this selector before probing
    required: false
    default: ""
  wait-for-network-idle:
    description: Wait up to 3 seconds for network idle
    required: false
    default: "false"
  smoke-mode:
    description: safe blocks post-load network; live permits real side effects
    required: false
    default: safe
  no-smoke:
    description: Skip the primary-CTA click
    required: false
    default: "false"
  smoke-selector:
    description: Explicit primary CTA selector
    required: false
    default: ""
  smoke-success-selector:
    description: Selector that must transition to visible after the CTA click
    required: false
    default: ""
  smoke-success-url-pattern:
    description: URL regex that must newly match after the CTA click
    required: false
    default: ""
  fail-on-warn:
    description: Make warnings fail the audit
    required: false
    default: "false"
  browser-channel:
    description: Optional Chrome channel such as chrome or msedge
    required: false
    default: ""
  python-version:
    description: Python version used to run the audit
    required: false
    default: "3.12"
  install-browser:
    description: Install Playwright Chromium before the audit
    required: false
    default: "true"
  upload-artifact:
    description: Upload reports and screenshots after the audit
    required: false
    default: "true"
  artifact-name:
    description: Uploaded artifact name
    required: false
    default: ego-webqa-report
  retention-days:
    description: Artifact retention in days
    required: false
    default: "14"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ego-webqa
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$ACTION_PATH"

    - name: Install Chromium
      if: ${{ inputs.install-browser == 'true' }}
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          python -m playwright install --with-deps chromium
        else
          python -m playwright install chromium
        fi

    - name: Run audit
      shell: bash
      env:
        WEBQA_URL: ${{ inputs.url }}
        WEBQA_CONFIG: ${{ inputs.config }}
        WEBQA_OUT: ${{ inputs.out }}
        WEBQA_PROFILE: ${{ inputs.profile }}
        WEBQA_VIEWPORTS: ${{ inputs.viewports }}
        WEBQA_READY_SELECTOR: ${{ inputs.ready-selector }}
        WEBQA_WAIT_NETWORK_IDLE: ${{ inputs.wait-for-network-idle }}
        WEBQA_SMOKE_MODE: ${{ inputs.smoke-mode }}
        WEBQA_NO_SMOKE: ${{ inputs.no-smoke }}
        WEBQA_SMOKE_SELECTOR: ${{ inputs.smoke-selector }}
        WEBQA_SUCCESS_SELECTOR: ${{ inputs.smoke-success-selector }}
        WEBQA_SUCCESS_URL: ${{ inputs.smoke-success-url-pattern }}
        WEBQA_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        WEBQA_BROWSER_CHANNEL: ${{ inputs.browser-channel }}
      run: |
        set -euo pipefail
        args=(
          "$WEBQA_URL"
          "--out" "$WEBQA_OUT"
          "--profile" "$WEBQA_PROFILE"
          "--smoke-mode" "$WEBQA_SMOKE_MODE"
        )
        if [[ -n "$WEBQA_CONFIG" ]]; then
          args+=(--config "$WEBQA_CONFIG")
        fi
        if [[ -n "$WEBQA_VIEWPORTS" ]]; then
          args+=(--viewports "$WEBQA_VIEWPORTS")
        fi
        if [[ -n "$WEBQA_READY_SELECTOR" ]]; then
          args+=(--ready-selector "$WEBQA_READY_SELECTOR")
        fi
        if [[ "$WEBQA_WAIT_NETWORK_IDLE" == "true" ]]; then
          args+=(--wait-for-network-idle)
        fi
        if [[ "$WEBQA_NO_SMOKE" == "true" ]]; then
          args+=(--no-smoke)
        fi
        if [[ -n "$WEBQA_SMOKE_SELECTOR" ]]; then
          args+=(--smoke-selector "$WEBQA_SMOKE_SELECTOR")
        fi
        if [[ -n "$WEBQA_SUCCESS_SELECTOR" ]]; then
          args+=(--smoke-success-selector "$WEBQA_SUCCESS_SELECTOR")
        fi
        if [[ -n "$WEBQA_SUCCESS_URL" ]]; then
          args+=(--smoke-success-url-pattern "$WEBQA_SUCCESS_URL")
        fi
        if [[ "$WEBQA_FAIL_ON_WARN" == "true" ]]; then
          args+=(--fail-on-warn)
        fi
        if [[ -n "$WEBQA_BROWSER_CHANNEL" ]]; then
          args+=(--browser-channel "$WEBQA_BROWSER_CHANNEL")
        fi
        python -m ego_webqa "${args[@]}"

    - name: Upload report
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out }}
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

branding:
  icon: check-circle
  color: green
