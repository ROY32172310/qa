[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-webqa"
version = "0.3.1"
description = "Deterministic coarse delivery QA for AI-generated web pages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Roy", email = "32172310@qq.com"}]
keywords = ["playwright", "web-qa", "accessibility", "ai-generated", "delivery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = ["playwright>=1.48"]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = [
  "black>=24",
  "build>=1.2",
  "mcp>=2.2,<3",
  "mypy>=1.11",
  "PyYAML>=6",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=5",
]

[project.scripts]
ego-webqa = "ego_webqa.cli:main"
ego-webqa-mcp = "ego_webqa.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ego_webqa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: requires Playwright and a Chromium-compatible browser",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
