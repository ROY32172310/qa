<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width">
  <title>Text scaling clean control</title>
  <link rel="stylesheet" href="/base.css">
  <style>
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .card { border: 1px solid #d5dce5; border-radius: 12px; padding: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Readable at enlarged text</h1>
    <section class="card">
      <h2>Flexible account summary</h2>
      <p>Labels wrap and controls reflow without clipping when text is enlarged.</p>
      <div class="actions">
        <button type="button">Review account</button>
        <button type="button">Contact support</button>
      </div>
    </section>
  </main>
</body>
</html>
