<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width">
  <title>Distorted media</title>
  <link rel="stylesheet" href="/base.css">
  <style>#distorted{width:100px;height:200px;max-width:100%}</style>
</head>
<body>
  <main>
    <h1>Stretched media</h1>
    <p>The source is square but its rendered box is twice as tall.</p>
    <img id="distorted" src="/square.svg" width="100" height="200" alt="Stretched square">
  </main>
</body>
</html>
