<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, viewport-fit=cover">
  <title>Safe area clean control</title>
  <link rel="stylesheet" href="/base.css">
  <style>
    main { padding: 32px 24px 120px; }
    .bottom-bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 0;
      min-height: 56px;
      padding: 4px 12px env(safe-area-inset-bottom, 0px);
      background: #17202a;
    }
    .bottom-bar button { width: 100%; }
  </style>
</head>
<body>
  <main>
    <h1>Delivery preferences</h1>
    <p>The fixed action bar reserves the device bottom safe-area inset.</p>
  </main>
  <div class="bottom-bar"><button type="button">Save preferences</button></div>
</body>
</html>
