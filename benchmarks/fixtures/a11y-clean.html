<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width">
  <title>Accessible delivery</title>
  <link rel="stylesheet" href="/base.css">
</head>
<body>
  <main>
    <h1>Accessible page</h1>
    <p>The clean accessibility control has a title, language, labels, and ordered headings.</p>
    <h2>Contact</h2>
    <form>
      <label for="email">Email</label>
      <input id="email" name="email" type="email">
      <button type="submit">Continue</button>
    </form>
    <img src="/square.svg" width="80" height="80" alt="Decorative square sample">
    <div id="unique">Unique target.</div>
  </main>
</body>
</html>
