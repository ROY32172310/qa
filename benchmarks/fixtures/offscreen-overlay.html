<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width">
  <title>Offscreen overlay</title>
  <link rel="stylesheet" href="/base.css">
</head>
<body>
  <main>
    <h1>Offscreen panel</h1>

  </main>
</body>
</html>
